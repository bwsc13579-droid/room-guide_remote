<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>객실 사용 설명서</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- 이미지를 교체하려면 images/remote.png 파일만 바꾸면 됩니다. 여러 장이면 <img> 줄을 추가하세요. -->
    <div class="notice">
      <img src="images/remote.png" alt="객실 사용 설명서" onerror="this.remove();document.querySelector('.pending').classList.add('show')">
    </div>
    <p class="pending">안내문을 준비 중입니다.</p>
  </main>
</body>
</html>
