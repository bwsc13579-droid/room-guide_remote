<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>객실 사용 설명서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page" id="top">
    <header class="head has-jump">
      <div class="eyebrow">HOTEL SOKCHO · ROOM GUIDE</div>
      <h1>객실 사용 설명서</h1>
      <p>TV, 에어컨, 난방·조명을 사용하는 방법을 안내해 드립니다.</p>
    </header>

    <nav class="jump" aria-label="바로가기">
      <div class="jump-label">바로가기</div>
      <a class="btn btn-outline" href="#tv"><span class="no">01</span><span class="title">TV 리모컨</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
      <a class="btn btn-outline" href="#aircon"><span class="no">02</span><span class="title">에어컨 리모컨</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
      <a class="btn btn-outline" href="#heating"><span class="no">03</span><span class="title">난방·조명 패널</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
    </nav>

    <!-- 이미지를 교체하려면 images/ 안의 같은 이름 파일만 바꾸면 됩니다. 크기가 바뀌면 width/height 값도 맞춰 주세요. -->
    <main class="guides">
      <article class="guide" id="tv">
        <div class="guide-head"><span class="badge">01</span><h2>TV 리모컨</h2></div>
        <div class="card"><img src="images/tv.png" width="1448" height="1086" loading="lazy" alt="LG 헬로비전 TV 리모컨 사용 안내"></div>
        <div class="guide-action"><a class="btn btn-fill" href="images/tv.png" data-src="images/tv.png" data-title="TV 리모컨"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>크게 보기</a></div>
      </article>
      <article class="guide" id="aircon">
        <div class="guide-head"><span class="badge">02</span><h2>에어컨 리모컨</h2></div>
        <div class="card"><img src="images/aircon.png" width="1672" height="941" loading="lazy" alt="삼성 에어컨 리모컨 사용 안내"></div>
        <div class="guide-action"><a class="btn btn-fill" href="images/aircon.png" data-src="images/aircon.png" data-title="에어컨 리모컨"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>크게 보기</a></div>
      </article>
      <article class="guide" id="heating">
        <div class="guide-head"><span class="badge">03</span><h2>난방·조명 패널</h2></div>
        <div class="card"><img src="images/heating.png" width="1774" height="887" loading="lazy" alt="난방·조명 패널 사용 안내"></div>
        <div class="guide-action"><a class="btn btn-fill" href="images/heating.png" data-src="images/heating.png" data-title="난방·조명 패널"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>크게 보기</a></div>
      </article>
    </main>

    <footer class="foot">
      <a class="btn btn-outline" href="#top"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>맨 위로</a>
      <p>도움이 필요하시면 프론트로 연락해 주세요.<br><strong class="ext">내선 201#~203#</strong></p>
    </footer>
  </div>

  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true">
    <div class="viewer-bar">
      <span class="viewer-title"></span>
      <button class="viewer-close" type="button" aria-label="닫기"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="viewer-body"><img alt=""></div>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
